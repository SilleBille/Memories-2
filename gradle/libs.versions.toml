junit = { module = "junit:junit", version.ref = "junit" }
nextcloud-android-library = { group = "com.github.nextcloud", name = "android-library", version.ref = "nextcloudAndroid" }
nextcloud-sso = { group = "com.github.nextcloud", name = "Android-SingleSignOn", version.ref = "nextcloudSso" }
